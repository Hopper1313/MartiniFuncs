[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MartiniFuncs"
version = "0.1.0"
description = "Martini Collab Tools"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.29",
    "networkx>=3.1",
    "mccoygroup-mcutils",
    "mccoygroup-psience",
    "rdkit",
    "numpy",
    "scipy",
    "pandas",
    "periodictable",
]

[project.optional-dependencies]
uma = ["fairchem-core>=2.22,<3"]
notebooks = ["ipython", "ipykernel", "jupyterlab", "matplotlib"]

[project.scripts]
martini-postprocess = "MartiniFuncs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["MartiniFuncs*"]
